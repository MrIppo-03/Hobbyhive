<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15-Question Hobby Discovery Quiz - HobbyHive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Sticky Navigation & Progress Header -->
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-200/80">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3">
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-2 text-slate-800 hover:text-indigo-600 transition-colors">
          <span class="text-xl">←</span>
          <span class="text-xs sm:text-sm font-bold">Exit Quiz</span>
        </a>

        <div class="flex items-center space-x-2">
          <span id="quiz-step-indicator" class="text-xs sm:text-sm font-extrabold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-200">
            Question 1 of 15
          </span>
          <span id="quiz-percentage-badge" class="text-xs font-bold text-slate-500">0%</span>
        </div>

        <div id="nav-user-area" class="flex items-center">
          <!-- Populated by auth.js -->
        </div>
      </div>

      <!-- Animated Progress Bar -->
      <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden mt-3 shadow-inner">
        <div id="quiz-progress-bar" class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 transition-all duration-300 ease-out" style="width: 7%;"></div>
      </div>
    </div>
  </header>

  <!-- MAIN QUIZ CONTAINER -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8 max-w-3xl mx-auto w-full">
    
    <!-- Question Card -->
    <div class="w-full glass-panel p-6 sm:p-10 rounded-3xl shadow-xl border border-slate-200/90 relative overflow-hidden transition-all duration-300" id="question-card">
      
      <!-- Category Tag -->
      <div class="flex items-center justify-between mb-4">
        <span id="q-category-badge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-violet-100 text-violet-800 border border-violet-200">
          🌿 Environment
        </span>
        <span class="text-xs font-semibold text-slate-600 uppercase tracking-widest" id="q-number-pill">Q1</span>
      </div>

      <!-- Question Title -->
      <h2 id="q-title" class="font-display text-2xl sm:text-3xl font-black text-slate-900 leading-snug tracking-tight">
        Loading question...
      </h2>

      <!-- Subtitle / Hinglish Hint -->
      <p id="q-subtitle" class="text-sm sm:text-base text-slate-500 mt-2 italic font-medium">
        ...
      </p>

      <!-- Options Container -->
      <div id="options-container" class="mt-8 space-y-3 sm:space-y-4">
        <!-- Rendered dynamically -->
      </div>

      <!-- Bottom Nav Controls -->
      <div class="mt-10 pt-6 border-t border-slate-200/70 flex items-center justify-between">
        <button id="btn-prev" class="px-5 py-2.5 rounded-xl border border-slate-200 hover:border-slate-300 bg-white text-slate-700 font-bold text-xs sm:text-sm flex items-center space-x-2 transition-all disabled:opacity-40 disabled:cursor-not-allowed">
          <span>← Back</span>
        </button>

        <!-- Quick Dots / Stepper Navigation -->
        <div class="hidden sm:flex items-center space-x-1.5" id="stepper-dots">
          <!-- 15 dots rendered dynamically -->
        </div>

        <button id="btn-next" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-indigo-200 flex items-center space-x-2 transition-all disabled:opacity-40 disabled:cursor-not-allowed">
          <span>Next</span>
          <span>→</span>
        </button>
      </div>

    </div>

    <!-- Quick Reminder -->
    <div class="mt-6 text-center text-xs text-slate-600 flex items-center justify-center space-x-2">
      <span>💡</span>
      <span>Pick what genuinely excites you right now. You can change your answers anytime!</span>
    </div>

  </main>

  <!-- CALCULATING MODAL (Shows when finishing Q15) -->
  <div id="calculating-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-panel max-w-md w-full p-8 rounded-3xl text-center shadow-2xl border border-white/20">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-indigo-100 flex items-center justify-center text-4xl mb-4 animate-bounce">
        🔮
      </div>
      <h3 class="font-display text-2xl font-black text-slate-900 mb-2">Analyzing Your DNA Profile...</h3>
      <p class="text-sm text-slate-600 mb-6" id="calc-status-text">Weighing creative intuition, budget fit & active communities...</p>
      
      <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden mb-4">
        <div id="calc-progress" class="h-full bg-gradient-to-r from-indigo-500 to-pink-500 transition-all duration-700 w-0"></div>
      </div>

      <span class="text-xs font-bold text-indigo-600 uppercase tracking-widest">Matching 16+ Verified Hobbies</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/quiz-data.js"></script>
  <script src="js/communities-data.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Initialize Quiz Engine
    const engine = new HobbyQuizEngine(QUIZ_QUESTIONS, HOBBIES_CATALOG);

    const qCard = document.getElementById('question-card');
    const qTitle = document.getElementById('q-title');
    const qSubtitle = document.getElementById('q-subtitle');
    const qCategory = document.getElementById('q-category-badge');
    const qNumberPill = document.getElementById('q-number-pill');
    const optionsContainer = document.getElementById('options-container');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const stepIndicator = document.getElementById('quiz-step-indicator');
    const percentageBadge = document.getElementById('quiz-percentage-badge');
    const progressBar = document.getElementById('quiz-progress-bar');
    const stepperDots = document.getElementById('stepper-dots');

    // Create 15 Stepper Dots
    function renderStepperDots() {
      stepperDots.innerHTML = '';
      for (let i = 0; i < engine.getTotalQuestions(); i++) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.title = `Jump to Question ${i + 1}`;
        const isAnswered = engine.isAnswered(i + 1);
        const isCurrent = engine.currentIndex === i;

        dot.className = `w-2.5 h-2.5 rounded-full transition-all ${
          isCurrent 
            ? 'w-6 bg-indigo-600 shadow-sm' 
            : isAnswered 
              ? 'bg-emerald-500' 
              : 'bg-slate-200 hover:bg-slate-300'
        }`;

        dot.addEventListener('click', () => {
          engine.goTo(i);
          renderCurrentQuestion();
        });

        stepperDots.appendChild(dot);
      }
    }

    // Render Question
    function renderCurrentQuestion() {
      const q = engine.getCurrentQuestion();
      const currentNum = engine.currentIndex + 1;
      const total = engine.getTotalQuestions();
      const progressPercent = Math.round(((currentNum - 1) / total) * 100);

      // Header updates
      stepIndicator.textContent = `Question ${currentNum} of ${total}`;
      percentageBadge.textContent = `${progressPercent}%`;
      progressBar.style.width = `${Math.max(7, progressPercent)}%`;

      qCategory.textContent = `${q.badge} • ${q.category}`;
      qNumberPill.textContent = `Q${currentNum}`;
      qTitle.textContent = q.title;
      qSubtitle.textContent = q.subtitle || "";

      // Options
      optionsContainer.innerHTML = '';
      const selectedId = engine.getSelectedOptionId(q.id);

      q.options.forEach(opt => {
        const isSelected = selectedId === opt.id;
        const optEl = document.createElement('div');
        optEl.className = `option-card p-4 sm:p-5 rounded-2xl border-2 flex items-start space-x-4 ${
          isSelected 
            ? 'selected border-indigo-600 bg-indigo-50/70' 
            : 'border-slate-200/90 bg-white hover:border-indigo-300'
        }`;

        optEl.innerHTML = `
          <div class="text-3xl shrink-0 p-1.5 rounded-xl bg-slate-50 border border-slate-100 shadow-xs">${opt.emoji}</div>
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <h4 class="font-bold text-slate-900 text-base sm:text-lg">${opt.text}</h4>
              <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center text-xs font-bold ${
                isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300'
              }">${isSelected ? '✓' : ''}</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-500 mt-1 leading-relaxed">${opt.desc}</p>
          </div>
        `;

        optEl.addEventListener('click', () => {
          HobbyApp.playSound('click');
          engine.selectOption(q.id, opt.id);
          renderCurrentQuestion();

          // Auto advance if not on the last question
          if (engine.currentIndex < total - 1) {
            setTimeout(() => {
              engine.next();
              renderCurrentQuestion();
            }, 250);
          } else {
            // Last question answered! Check if complete
            if (engine.isCompleted()) {
              setTimeout(() => {
                finishQuiz();
              }, 400);
            }
          }
        });

        optionsContainer.appendChild(optEl);
      });

      // Navigation button states
      btnPrev.disabled = engine.currentIndex === 0;
      
      const isLast = engine.currentIndex === total - 1;
      if (isLast) {
        btnNext.innerHTML = `<span>See My Hobby Match 🎉</span>`;
        btnNext.className = "px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-emerald-200 flex items-center space-x-2 transition-all";
      } else {
        btnNext.innerHTML = `<span>Next</span><span>→</span>`;
        btnNext.className = "px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-indigo-200 flex items-center space-x-2 transition-all";
      }

      btnNext.disabled = !engine.isAnswered(q.id);

      renderStepperDots();
    }

    // Prev Button
    btnPrev.addEventListener('click', () => {
      HobbyApp.playSound('pop');
      if (engine.prev()) {
        renderCurrentQuestion();
      }
    });

    // Next / Finish Button
    btnNext.addEventListener('click', () => {
      HobbyApp.playSound('click');
      if (engine.currentIndex === engine.getTotalQuestions() - 1) {
        finishQuiz();
      } else {
        if (engine.next()) {
          renderCurrentQuestion();
        }
      }
    });

    // Finish Quiz & Transition to Allotment
    function finishQuiz() {
      const overlay = document.getElementById('calculating-overlay');
      const calcProgress = document.getElementById('calc-progress');
      const calcStatusText = document.getElementById('calc-status-text');

      overlay.classList.remove('hidden');
      HobbyApp.playSound('success');

      setTimeout(() => {
        calcProgress.style.width = '45%';
        calcStatusText.textContent = "Analyzing focus modes, sensory appetite & weekend schedules...";
      }, 400);

      setTimeout(() => {
        calcProgress.style.width = '85%';
        calcStatusText.textContent = "Ranking top subreddits, Discord voice lounges & starter kits...";
      }, 1000);

      setTimeout(() => {
        calcProgress.style.width = '100%';
        const result = engine.calculateAllotment();
        HobbyAuth.saveQuizResult(result);
        HobbyApp.launchConfetti();

        setTimeout(() => {
          window.location.href = 'result.html';
        }, 500);
      }, 1800);
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', () => {
      renderCurrentQuestion();
    });
  </script>
</body>
</html>
